name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimguard
          POSTGRES_PASSWORD: claimguard
          POSTGRES_DB: claimguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://claimguard:claimguard@localhost:5432/claimguard_test
      # Tests use a fake LLM client with recorded responses. CI never calls a real model:
      # it would cost money and give slightly different answers on every run.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_lg
      - name: Backend tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term --cov-fail-under=80
      - name: Evaluation metric tests
        run: python -m pytest evaluation

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-images:
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claimguard-api ./backend
      - run: docker build -t claimguard-frontend ./frontend
